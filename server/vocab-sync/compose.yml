# SuperDictate vocabulary sync — deployed on octopusreborn at
# /home/shohart/services/superdictate-sync. Caddy (nextcloud_caddy) proxies
# superdictate.bykovlegal.ru to 10.77.77.2:8095; the port is published on the
# private /30 link only, never on the LAN or public interfaces.
services:
  superdictate-sync:
    build: .
    container_name: superdictate-sync
    restart: unless-stopped
    ports:
      - "10.77.77.2:8095:8095"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/healthz')"]
      interval: 60s
      timeout: 5s
      retries: 3
